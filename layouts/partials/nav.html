<nav class="site-nav" role="navigation" aria-label="Main navigation">
  <div class="container nav-inner">
    <a href="/" class="nav-logo" aria-label="{{ .Site.Params.labName }} home">
      <img src="/images/logo.svg" alt="{{ .Site.Params.labName }}, Computational Cancer Research" class="nav-logo-img" width="176" height="60">
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>

    <ul class="nav-links" role="list">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}"
           {{ if eq $.RelPermalink .URL }}class="active" aria-current="page"{{ end }}>
          {{ .Name }}
        </a>
      </li>
      {{ end }}
    </ul>
  </div>
</nav>
