# SEMINAR ARCHIVE — past (and planned) sessions of seminar series the lab
# helps run. Shown on /events/ under "Seminar archive", grouped by year.
# Newest first. Talks by lab members are highlighted.
#
#   date:  "2026-03-24"   exact day   — or —   month: "2024-11" if only the month is known
#   theme: optional session theme
#   talks:
#     - speaker: "Name"
#       role:    "Position, affiliation"   (optional)
#       title:   "Talk title"              (optional)
#       person:  people file name if a lab member (e.g. "shangqi-gao") — highlighted,
#                and linked to their profile unless that profile is hidden
#
# Sources: integratedcancermedicine.org/research/cambridge-medai-seminar-series/
#          milner.cam.ac.uk/ai-club/
# ─────────────────────────────────────────────────────────────
