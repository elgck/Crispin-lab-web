baseURL = "https://crispinlab.com/"
locale = "en-GB"
title = "Crispin Lab"
# Make internal links relative so the site works both at a custom domain and
# under a sub-path such as https://elgck.github.io/Crispin-lab-web/
relativeURLs = true

[params]
  labName = "Crispin Lab"
  labFullName = "Computational Cancer Research"
  tagline = "Machine learning · Medical imaging · Computational pathology · Multi-omics"
  pi = "Dr Mireia Crispin-Ortuzar"
  institution = "University of Cambridge"
  department = "Department of Oncology"
  institute = "Early Cancer Institute"
  email = "mc973@cam.ac.uk"
  description = "We build computational models that learn from routine clinical data, such as pathology slides, CT scans, genomics and patient records, to detect cancer earlier, characterise it more precisely and guide treatment."

  # ── Job advert pop-up ─────────────────────────────────────
  # Shows on every page until the closing date. Set enabled = false to hide it.
  [params.vacancy]
    enabled = true
    title = "Postdoctoral Research Associate in Agentic AI for Cancer Care"
    summary = "Join the IMPACT-OC consortium developing multi-agent AI for ovarian cancer across imaging, genomics, histopathology and clinical records."
    url = "https://www.cam.ac.uk/jobs/postdoctoral-research-associate-in-agentic-ai-for-cancer-care-fixed-term-rd51541"
    ref = "RD51541"
    closes = "2026-11-29"
    email = "mc973@cam.ac.uk"

  # ── LinkedIn news feed ───────────────────────────────────
  # The News page embeds the lab's LinkedIn posts. Paste the embed code from
  # your feed-widget provider into layouts/partials/linkedin-widget.html.
  [params.linkedin]
    url = "https://www.linkedin.com/company/crispin-lab/"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = -1
  [[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 1
  [[menu.main]]
    name = "People"
    url = "/people/"
    weight = 2
  [[menu.main]]
    name = "Publications"
    url = "/publications/"
    weight = 4
  [[menu.main]]
    name = "Opportunities"
    url = "/opportunities/"
    weight = 5
  [[menu.main]]
    name = "Events"
    url = "/events/"
    weight = 6
  [[menu.main]]
    name = "News"
    url = "/news/"
    weight = 6
  [[menu.main]]
    name = "Gallery"
    url = "/gallery/"
    weight = 7
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 8

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
